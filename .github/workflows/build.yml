name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
          
      - name: Build with Buildozer
        run: |
          echo y | buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souvenirs-apk
          path: bin/*.apk
